name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Build
        env:
          # A project site is served from /<repo>/; a <user>.github.io repo from /.
          VITE_BASE: ${{ endsWith(github.repository, format('{0}.github.io', github.repository_owner)) && '/' || format('/{0}/', github.event.repository.name) }}
          VITE_FORMSPREE_ID: ${{ secrets.VITE_FORMSPREE_ID }}
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on (source: GitHub Actions) the first time this runs.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
